services:
  localstack:
    container_name: localstack_s3_lab
    image: localstack/localstack:3.4.0
    ports:
      - "localhost:4566:4566"
      - "localhost:4510-4559:4510-4559"
    environment:
      - DEBUG=1
      - ACTIVATE_PRO=0
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"